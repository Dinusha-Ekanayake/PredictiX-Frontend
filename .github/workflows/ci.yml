name: CI

# Vercel builds and deploys this app on its own. This workflow is the quality
# gate in front of that: typecheck, lint, tests and a real production build,
# so a broken commit is caught here rather than on a preview URL.
on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Node 22 LTS: @testing-library/jest-dom 7 requires >= 22, and matches local dev.
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # npm ci is reproducible and fails when package-lock.json is stale,
        # which is what we want in CI.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Blocking: the project is at zero eslint errors, so any new one is a
        # regression introduced by the change under review.
        run: npm run lint

      - name: Tests
        # The runner exits non-zero on failure and also when no tests ran, so
        # a misconfigured reporter cannot pass silently.
        run: npm test

      - name: Production build
        # Values are read at build time, so a missing one shows up here rather
        # than as a blank page in a preview deployment.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend CI"
            echo ""
            echo "| step | result |"
            echo "| --- | --- |"
            echo "| overall | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # The runner is pinned to ubuntu-24.04: ubuntu-latest moved to 26.04,
        # which this Playwright version does not support.
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # playwright.config.ts builds the app against a fake API host and
        # intercepts every call, so no backend or secrets are needed here.
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high severity advisories
        # Reported, not blocking: a transitive advisory with no available fix
        # should not stop an unrelated bugfix from shipping.
        run: npm audit --audit-level=high
        continue-on-error: true
