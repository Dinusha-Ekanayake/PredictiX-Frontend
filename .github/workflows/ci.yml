name: CI

# Vercel builds and deploys this app on its own. This workflow is the quality
# gate in front of that: typecheck, lint, tests and a real production build,
# so a broken commit is caught here rather than on a preview URL.
on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # npm ci is reproducible and fails when package-lock.json is stale,
        # which is what we want in CI.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Blocking: the project is at zero eslint errors, so any new one is a
        # regression introduced by the change under review.
        run: npm run lint

      - name: Tests
        # The runner exits non-zero on failure and also when no tests ran, so
        # a misconfigured reporter cannot pass silently.
        run: npm test

      - name: Production build
        # Values are read at build time, so a missing one shows up here rather
        # than as a blank page in a preview deployment.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend CI"
            echo ""
            echo "| step | result |"
            echo "| --- | --- |"
            echo "| overall | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high severity advisories
        # Reported, not blocking: a transitive advisory with no available fix
        # should not stop an unrelated bugfix from shipping.
        run: npm audit --audit-level=high
        continue-on-error: true
